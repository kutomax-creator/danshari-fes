<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>断捨離フェス</title>
<style>
  :root {
    --bg: #0A1830; --card: #0F2140; --card-top: #152A4D;
    --border: #1D3358; --border-top: #F2B441;
    --gold: #F2B441; --gold-hover: #F7C462;
    --text: #EAF0FA; --muted: #8AA0C4; --muted2: #5E7196; --danger: #F2A0A0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: 'Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',system-ui,sans-serif;
    padding: 28px 16px 48px; position: relative;
  }
  .glow {
    position: fixed; top: -120px; left: 50%; transform: translateX(-50%);
    width: 480px; height: 280px;
    background: radial-gradient(ellipse at center,rgba(242,180,65,.14),transparent 70%);
    pointer-events: none; z-index: 0;
  }
  header,.composer,.list,.sortRow,.resetRow { position: relative; z-index: 1; max-width: 560px; margin-left: auto; margin-right: auto; }
  header { text-align: center; margin-bottom: 20px; }
  .eyebrow { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; letter-spacing: .04em; color: var(--muted); margin-bottom: 10px; }
  h1 { font-size: 24px; font-weight: 800; margin: 0; cursor: text; letter-spacing: .01em; }
  #titleInput {
    font-size: 24px; font-weight: 800; background: transparent; border: none;
    border-bottom: 2px solid var(--gold); color: var(--text); text-align: center;
    width: 100%; padding: 2px 0; font-family: inherit; display: none;
  }
  .composer {
    display: flex; gap: 8px; background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 10px; margin-bottom: 14px;
  }
  textarea {
    flex: 1; resize: none; background: transparent; border: none; color: var(--text);
    font-size: 14px; font-family: inherit; line-height: 1.5;
  }
  textarea:focus, #titleInput:focus { outline: none; }
  #sendBtn {
    display: flex; align-items: center; gap: 6px; align-self: flex-end;
    background: var(--gold); color: var(--bg); border: none; border-radius: 10px;
    padding: 9px 14px; font-size: 13px; font-weight: 700; cursor: pointer;
    transition: transform .15s,background .15s; white-space: nowrap;
  }
  #sendBtn:not(:disabled):hover { background: var(--gold-hover); transform: translateY(-1px); }
  #sendBtn:disabled { opacity: .4; cursor: default; }
  .errorBar { text-align: center; font-size: 12px; color: var(--danger); margin-bottom: 10px; }

  /* Sort */
  .sortRow { display: none; justify-content: flex-end; gap: 6px; margin-bottom: 10px; }
  .sortRow.show { display: flex; }
  .sort-btn {
    background: transparent; border: 1px solid var(--border); border-radius: 20px;
    padding: 4px 12px; font-size: 11px; color: var(--muted2); cursor: pointer;
    font-family: inherit; transition: border-color .15s,color .15s;
  }
  .sort-btn.active { border-color: var(--gold); color: var(--gold); }
  .sort-btn:hover:not(.active) { color: var(--muted); }

  /* Cards */
  .list { display: flex; flex-direction: column; gap: 10px; }
  .empty { text-align: center; color: var(--muted2); font-size: 13px; padding: 30px 0; }
  .card {
    position: relative; background: var(--card);
    border: 1px solid var(--border); border-left-width: 3px;
    border-radius: 14px; padding: 14px 14px 10px 14px;
    transition: border-color .3s,background .3s;
  }
  .card.top { border-top-color: var(--border-top); border-right-color: var(--border-top); border-bottom-color: var(--border-top); background: var(--card-top); animation: pulse 1.8s ease-out; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(242,180,65,.45)} 100%{box-shadow:0 0 0 10px rgba(242,180,65,0)} }
  .badge {
    position: absolute; top: -9px; left: 12px; display: flex; align-items: center; gap: 3px;
    background: var(--gold); color: var(--bg); font-size: 10px; font-weight: 800;
    letter-spacing: .04em; border-radius: 999px; padding: 2px 8px 2px 6px;
  }
  .cardText { font-size: 14.5px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  .quote { color: var(--muted); border-left: 2px solid var(--muted2); padding-left: 8px; display: block; font-size: 13px; }
  .cardFooter { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
  .cardTs { font-size: 11px; color: var(--muted2); }
  .replyBtn {
    background: transparent; border: none; color: var(--muted2); font-size: 11px;
    cursor: pointer; padding: 0; font-family: inherit; transition: color .15s;
    display: flex; align-items: center; gap: 3px;
  }
  .replyBtn:hover { color: var(--muted); }

  /* Reactions */
  .reactions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .rxn {
    display: flex; align-items: center; gap: 4px;
    background: var(--bg); border: 1px solid #24406B; border-radius: 20px;
    padding: 4px 10px; cursor: pointer; color: var(--muted2);
    font-family: inherit; transition: border-color .15s,color .15s,transform .1s;
  }
  .rxn .rxn-emoji { font-size: 14px; line-height: 1; }
  .rxn .rxn-count { font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .rxn:not(:disabled):hover { border-color: var(--gold); color: var(--text); transform: scale(1.06); }
  .rxn:not(:disabled):active { transform: scale(.94); }
  .rxn.voted { border-color: var(--gold); color: var(--text); }
  .rxn:disabled { cursor: default; }

  /* Bottom row */
  .resetRow { display: flex; justify-content: center; align-items: center; gap: 18px; margin-top: 30px; flex-wrap: wrap; }
  #resetBtn,#settingsBtn,#qrBtn {
    display: flex; align-items: center; gap: 5px; background: transparent; border: none;
    color: var(--muted2); font-size: 11px; cursor: pointer; transition: color .15s;
  }
  #resetBtn:hover,#settingsBtn:hover,#qrBtn:hover { color: var(--muted); }
  svg { display: block; }
  .settingsBanner {
    max-width: 560px; margin: 0 auto 14px; background: var(--card);
    border: 1px solid var(--border-top); border-radius: 14px; padding: 14px 16px; display: none;
  }
  .settingsBanner.show { display: block; }
  .settingsBanner p { margin: 0 0 10px; font-size: 12.5px; color: var(--muted); line-height: 1.6; }
  .settingsRow { display: flex; gap: 8px; }
  #urlInput {
    flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 10px; color: var(--text); font-size: 12.5px; font-family: inherit;
  }
  #urlInput:focus { outline: none; border-color: var(--gold); }
  #urlSaveBtn {
    background: var(--gold); color: var(--bg); border: none; border-radius: 8px;
    padding: 8px 14px; font-size: 12.5px; font-weight: 700; cursor: pointer; white-space: nowrap;
  }
  #urlSaveBtn:hover { background: var(--gold-hover); }

  /* Modals */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(5,12,28,.88);
    display: flex; align-items: center; justify-content: center; z-index: 200;
  }
  .modal-box {
    background: var(--card); border: 1px solid var(--border); border-radius: 18px;
    padding: 24px 22px; width: min(340px,calc(100vw - 32px)); box-shadow: 0 12px 48px rgba(0,0,0,.6);
  }
  .modal-title { font-size: 15px; font-weight: 800; margin-bottom: 16px; text-align: center; }
  .modal-body input[type=password] {
    width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; color: var(--text); font-size: 20px; font-family: inherit;
    letter-spacing: .3em; text-align: center;
  }
  .modal-body input[type=password]:focus { outline: none; border-color: var(--gold); }
  .modal-actions { display: flex; gap: 8px; margin-top: 16px; justify-content: flex-end; }
  .btn-cancel {
    background: transparent; border: 1px solid var(--border); border-radius: 8px;
    padding: 9px 18px; font-size: 13px; font-weight: 700; cursor: pointer; color: var(--muted); font-family: inherit;
  }
  .btn-ok {
    background: var(--gold); border: none; border-radius: 8px;
    padding: 9px 18px; font-size: 13px; font-weight: 700; cursor: pointer; color: var(--bg); font-family: inherit;
  }
  .btn-ok:hover { background: var(--gold-hover); }
  .pass-hint { font-size: 11.5px; color: var(--danger); text-align: center; min-height: 18px; margin-top: 8px; }
  .qr-wrap { background: #fff; border-radius: 12px; padding: 14px; display: inline-block; }
  .qr-url { font-size: 11px; color: var(--muted); word-break: break-all; margin-top: 12px; line-height: 1.6; }
</style>
</head>
<body>
<div class="glow"></div>

<header>
  <div class="eyebrow">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
    <span id="countLabel">0件のコメント・匿名・リアルタイム更新</span>
    <span id="connDot" style="display:none;color:#F2B441;font-size:10px;margin-left:2px" title="サーバーに接続できません">● 未接続</span>
  </div>
  <h1 id="titleText">断捨離フェス</h1>
  <input id="titleInput" maxlength="60">
</header>

<div id="settingsBanner" class="settingsBanner">
  <p>Google Apps Script のウェブアプリ URL（<code>.../exec</code>）を貼り付けてください。</p>
  <div class="settingsRow">
    <input id="urlInput" placeholder="https://script.google.com/macros/s/.../exec">
    <button id="urlSaveBtn">保存</button>
  </div>
</div>

<div class="composer">
  <textarea id="commentInput" placeholder="ここに匿名でコメントを送信…" maxlength="280" rows="2"></textarea>
  <button id="sendBtn" disabled>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    送信
  </button>
</div>

<div id="errorBar" class="errorBar" style="display:none"></div>

<div id="sortRow" class="sortRow">
  <button id="sortVotesBtn" class="sort-btn active">リアクション順</button>
  <button id="sortNewBtn" class="sort-btn">新着順</button>
</div>

<div id="list" class="list"><div class="empty">読み込み中…</div></div>

<div class="resetRow">
  <button id="qrBtn">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/>
      <rect x="5" y="5" width="3" height="3" fill="currentColor" stroke="none"/><rect x="16" y="5" width="3" height="3" fill="currentColor" stroke="none"/><rect x="5" y="16" width="3" height="3" fill="currentColor" stroke="none"/>
      <path d="M14 14h2v2h-2zM18 14h2v2h-2zM14 18h2v2h-2zM18 18h2v2h-2z" fill="currentColor" stroke="none"/>
    </svg>
    QRコード
  </button>
  <button id="settingsBtn">
    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    接続設定
  </button>
  <button id="resetBtn">
    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
    すべて削除（主催者用）
  </button>
</div>

<!-- Password Modal -->
<div id="passModal" class="modal-overlay" style="display:none">
  <div class="modal-box">
    <div class="modal-title">管理者認証</div>
    <div class="modal-body">
      <input type="password" id="passInput" placeholder="パスワードを入力" autocomplete="off">
      <div id="passHint" class="pass-hint"></div>
    </div>
    <div class="modal-actions">
      <button id="passCancelBtn" class="btn-cancel">キャンセル</button>
      <button id="passOkBtn" class="btn-ok">認証</button>
    </div>
  </div>
</div>

<!-- QR Modal -->
<div id="qrModal" class="modal-overlay" style="display:none">
  <div class="modal-box" style="text-align:center">
    <div class="modal-title">参加者用QRコード</div>
    <div class="modal-body">
      <div class="qr-wrap"><img id="qrImg" width="200" height="200" alt="QR Code"></div>
      <div id="qrUrl" class="qr-url"></div>
    </div>
    <div class="modal-actions" style="justify-content:center;margin-top:16px">
      <button id="qrCloseBtn" class="btn-cancel" style="padding:9px 36px">閉じる</button>
    </div>
  </div>
</div>

<script>
  var APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbytM8iEkRSpqSmjqSJwj8dnAiYF9N9mZuVwH2oxQshOa2YqreiiMhemnl3avdTpRoZO/exec';
  var ADMIN_PASS      = '0961';
  var REACTIONS       = ['👍','👏','🔥','❓'];
  var PALETTE         = ['#4FC3F7','#A5D6A7','#F48FB1','#CE93D8','#FFAB91','#80DEEA','#EF9A9A','#80CBC4','#FFD54F','#B39DDB','#BCAAA4','#FFF176'];

  var STORAGE_KEY_URL  = 'cw_apps_script_url';
  var STORAGE_KEY_RXNS = 'cw_voted_r';
  var STORAGE_KEY_CLR  = 'cw_color';
  var SESSION_KEY_ADMIN = 'cw_admin';
  var POLL_MS = 2500;

  if (!APPS_SCRIPT_URL) {
    try { APPS_SCRIPT_URL = localStorage.getItem(STORAGE_KEY_URL) || ''; } catch(e) {}
  }

  // セッションカラー（このブラウザに固有の色）
  var sessionColor = '';
  try {
    sessionColor = localStorage.getItem(STORAGE_KEY_CLR) || '';
    if (!sessionColor) {
      sessionColor = PALETTE[Math.floor(Math.random() * PALETTE.length)];
      localStorage.setItem(STORAGE_KEY_CLR, sessionColor);
    }
  } catch(e) {}

  // リアクション投票履歴 { commentId: ['👍','🔥', ...] }
  var votedReactions = {};
  try { votedReactions = JSON.parse(localStorage.getItem(STORAGE_KEY_RXNS) || '{}'); } catch(e) {}
  function hasVoted(id, type) { return votedReactions[id] && votedReactions[id].indexOf(type) !== -1; }
  function addVoted(id, type) {
    if (!votedReactions[id]) votedReactions[id] = [];
    if (!hasVoted(id, type)) votedReactions[id].push(type);
    try { localStorage.setItem(STORAGE_KEY_RXNS, JSON.stringify(votedReactions)); } catch(e) {}
  }
  function totalReactions(reactions) {
    if (!reactions) return 0;
    return REACTIONS.reduce(function(s, k) { return s + (reactions[k] || 0); }, 0);
  }

  // ── Admin ───────────────────────────────────
  function isAdmin() { try { return sessionStorage.getItem(SESSION_KEY_ADMIN) === '1'; } catch(e) { return false; } }
  var pendingAdminCb = null;
  function requireAdmin(cb) {
    if (isAdmin()) { cb(); return; }
    pendingAdminCb = cb;
    els.passInput.value = ''; els.passHint.textContent = '';
    els.passModal.style.display = 'flex';
    setTimeout(function() { els.passInput.focus(); }, 50);
  }
  function submitPass() {
    if (els.passInput.value === ADMIN_PASS) {
      try { sessionStorage.setItem(SESSION_KEY_ADMIN, '1'); } catch(e) {}
      els.passModal.style.display = 'none';
      if (pendingAdminCb) { var cb = pendingAdminCb; pendingAdminCb = null; cb(); }
    } else {
      els.passHint.textContent = 'パスワードが違います';
      els.passInput.value = ''; els.passInput.focus();
    }
  }
  function cancelPass() { els.passModal.style.display = 'none'; pendingAdminCb = null; }

  // ── QR ──────────────────────────────────────
  function showQR() {
    var url = location.href.split('?')[0];
    if (url.slice(-1) !== '/') url += '/';
    els.qrUrl.textContent = url;
    els.qrImg.src = 'https://api.qrserver.com/v1/create-qr-code/?size=200x200&margin=0&data=' + encodeURIComponent(url);
    els.qrModal.style.display = 'flex';
  }

  // ── Timestamp ───────────────────────────────
  function formatTs(ts) {
    if (!ts) return '';
    var diff = Date.now() - ts;
    if (diff < 60000) return 'たった今';
    if (diff < 3600000) return Math.floor(diff / 60000) + '分前';
    var d = new Date(ts), pad = function(n){ return ('0'+n).slice(-2); };
    if (d.toDateString() === new Date().toDateString()) return pad(d.getHours()) + ':' + pad(d.getMinutes());
    return (d.getMonth()+1) + '/' + d.getDate() + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  // ── JSONP ────────────────────────────────────
  function jsonp(action, params) {
    return new Promise(function(resolve, reject) {
      if (!APPS_SCRIPT_URL) { reject(new Error('URL未設定')); return; }
      var id  = 'cb_' + Date.now() + '_' + Math.floor(Math.random() * 1e6);
      var tid = setTimeout(function() { cleanup(); reject(new Error('timeout')); }, 8000);
      function cleanup() { clearTimeout(tid); delete window[id]; var s = document.getElementById(id); if (s) s.remove(); }
      window[id] = function(data) { cleanup(); resolve(data); };
      var url = APPS_SCRIPT_URL + '?action=' + encodeURIComponent(action) + '&callback=' + id;
      for (var k in (params || {})) url += '&' + encodeURIComponent(k) + '=' + encodeURIComponent(params[k]);
      var s = document.createElement('script'); s.id = id; s.src = url;
      s.onerror = function() { cleanup(); reject(new Error('network error')); };
      document.body.appendChild(s);
    });
  }

  var els = {
    countLabel:     document.getElementById('countLabel'),
    connDot:        document.getElementById('connDot'),
    titleText:      document.getElementById('titleText'),
    titleInput:     document.getElementById('titleInput'),
    commentInput:   document.getElementById('commentInput'),
    sendBtn:        document.getElementById('sendBtn'),
    errorBar:       document.getElementById('errorBar'),
    list:           document.getElementById('list'),
    sortRow:        document.getElementById('sortRow'),
    sortVotesBtn:   document.getElementById('sortVotesBtn'),
    sortNewBtn:     document.getElementById('sortNewBtn'),
    resetBtn:       document.getElementById('resetBtn'),
    settingsBtn:    document.getElementById('settingsBtn'),
    settingsBanner: document.getElementById('settingsBanner'),
    urlInput:       document.getElementById('urlInput'),
    urlSaveBtn:     document.getElementById('urlSaveBtn'),
    qrBtn:          document.getElementById('qrBtn'),
    passModal:      document.getElementById('passModal'),
    passInput:      document.getElementById('passInput'),
    passHint:       document.getElementById('passHint'),
    passCancelBtn:  document.getElementById('passCancelBtn'),
    passOkBtn:      document.getElementById('passOkBtn'),
    qrModal:        document.getElementById('qrModal'),
    qrImg:          document.getElementById('qrImg'),
    qrUrl:          document.getElementById('qrUrl'),
    qrCloseBtn:     document.getElementById('qrCloseBtn'),
  };

  function escapeHtml(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
  function showError(msg) { els.errorBar.textContent = msg; els.errorBar.style.display = msg ? 'block' : 'none'; }

  // ── Poll status ──────────────────────────────
  var pollFailCount = 0;
  function showPollStatus(ok) {
    if (ok) { pollFailCount = 0; els.connDot.style.display = 'none'; }
    else { if (++pollFailCount >= 3) els.connDot.style.display = 'inline'; }
  }

  // ── Render ───────────────────────────────────
  var sortMode = 'votes';
  var cachedComments = [], cachedTitle = '';

  function render(comments, title) { cachedComments = comments; cachedTitle = title; renderSorted(); }
  function renderSorted() {
    els.titleText.textContent = cachedTitle || '断捨離フェス';
    els.countLabel.textContent = cachedComments.length + '件のコメント・匿名・リアルタイム更新';
    els.sortRow.classList.toggle('show', cachedComments.length > 0);

    var sorted = cachedComments.slice().sort(sortMode === 'new'
      ? function(a,b){ return b.ts - a.ts; }
      : function(a,b){ return totalReactions(b.reactions) - totalReactions(a.reactions) || a.ts - b.ts; }
    );
    var topId = (sortMode === 'votes' && sorted.length && totalReactions(sorted[0].reactions) > 0) ? sorted[0].id : null;

    if (!sorted.length) { els.list.innerHTML = '<div class="empty">まだコメントはありません。最初の一言をどうぞ。</div>'; return; }

    els.list.innerHTML = sorted.map(function(c) {
      var isTop  = c.id === topId;
      var clr    = c.color || 'var(--border)';
      var rxns   = c.reactions || {};

      var reactionHtml = REACTIONS.map(function(emoji) {
        var cnt   = rxns[emoji] || 0;
        var voted = hasVoted(c.id, emoji);
        return '<button class="rxn' + (voted ? ' voted' : '') + '" data-id="' + c.id + '" data-type="' + emoji + '" ' + (voted ? 'disabled' : '') + '>' +
          '<span class="rxn-emoji">' + emoji + '</span>' +
          '<span class="rxn-count">' + cnt + '</span>' +
          '</button>';
      }).join('');

      // ＞で始まる行を引用スタイルに
      var textHtml = escapeHtml(c.text).split('\n').map(function(line) {
        return line.charAt(0) === '＞'
          ? '<span class="quote">' + line + '</span>'
          : line;
      }).join('\n');

      return '<div class="card' + (isTop ? ' top' : '') + '" style="border-left-color:' + clr + '">' +
        (isTop ? '<div class="badge"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M8 21h8M12 17v4M17 5V3H7v2M17 5a5 5 0 0 1-10 0M17 5h2a2 2 0 0 1 0 4h-1M7 5H5a2 2 0 0 0 0 4h1"/></svg>TOP</div>' : '') +
        '<div class="cardText">' + textHtml + '</div>' +
        '<div class="cardFooter">' +
          '<span class="cardTs">' + formatTs(c.ts) + '</span>' +
          '<button class="replyBtn" data-text="' + escapeHtml(c.text) + '">' +
            '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 17 4 12 9 7"/><path d="M20 18v-2a4 4 0 0 0-4-4H4"/></svg>' +
            '返信' +
          '</button>' +
        '</div>' +
        '<div class="reactions">' + reactionHtml + '</div>' +
        '</div>';
    }).join('');

    // リアクションボタン
    Array.prototype.forEach.call(els.list.querySelectorAll('.rxn'), function(btn) {
      btn.addEventListener('click', function() { vote(btn.dataset.id, btn.dataset.type); });
    });
    // 返信ボタン
    Array.prototype.forEach.call(els.list.querySelectorAll('.replyBtn'), function(btn) {
      btn.addEventListener('click', function() { setReply(btn.dataset.text); });
    });
  }

  // ── Sort ─────────────────────────────────────
  els.sortVotesBtn.addEventListener('click', function() {
    sortMode = 'votes'; els.sortVotesBtn.classList.add('active'); els.sortNewBtn.classList.remove('active'); renderSorted();
  });
  els.sortNewBtn.addEventListener('click', function() {
    sortMode = 'new'; els.sortNewBtn.classList.add('active'); els.sortVotesBtn.classList.remove('active'); renderSorted();
  });

  // ── Settings ─────────────────────────────────
  function saveSettings() {
    var v = els.urlInput.value.trim(); if (!v) return;
    APPS_SCRIPT_URL = v;
    try { localStorage.setItem(STORAGE_KEY_URL, APPS_SCRIPT_URL); } catch(e) {}
    els.settingsBanner.classList.remove('show'); showError(''); refresh();
  }
  els.settingsBtn.addEventListener('click', function() {
    requireAdmin(function() {
      els.settingsBanner.classList.toggle('show');
      if (els.settingsBanner.classList.contains('show')) { els.urlInput.value = APPS_SCRIPT_URL; els.urlInput.focus(); }
    });
  });
  els.urlSaveBtn.addEventListener('click', saveSettings);
  els.urlInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') saveSettings(); });
  if (!APPS_SCRIPT_URL) { els.settingsBanner.classList.add('show'); els.urlInput.focus(); }

  // ── Admin events ─────────────────────────────
  els.passOkBtn.addEventListener('click', submitPass);
  els.passCancelBtn.addEventListener('click', cancelPass);
  els.passInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') submitPass(); if (e.key === 'Escape') cancelPass(); });
  els.passModal.addEventListener('click', function(e) { if (e.target === els.passModal) cancelPass(); });

  // ── QR events ────────────────────────────────
  els.qrBtn.addEventListener('click', showQR);
  els.qrCloseBtn.addEventListener('click', function() { els.qrModal.style.display = 'none'; });
  els.qrModal.addEventListener('click', function(e) { if (e.target === els.qrModal) els.qrModal.style.display = 'none'; });

  // ── Submit ───────────────────────────────────
  function submitComment() {
    var text = els.commentInput.value.trim(); if (!text) return;
    els.sendBtn.disabled = true;
    jsonp('submit', { text: text, color: sessionColor }).then(function(res) {
      if (res.ok) { render(res.comments, res.title); els.commentInput.value = ''; showError(''); }
      else showError('送信に失敗しました: ' + res.error);
    }).catch(function() { showError('送信に失敗しました。通信環境をご確認ください。'); })
    .finally(function() { els.sendBtn.disabled = !els.commentInput.value.trim(); });
  }
  els.commentInput.addEventListener('input', function() { els.sendBtn.disabled = !els.commentInput.value.trim(); });
  els.commentInput.addEventListener('keydown', function(e) { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) submitComment(); });
  els.sendBtn.addEventListener('click', submitComment);

  // ── Vote ─────────────────────────────────────
  function vote(id, type) {
    if (hasVoted(id, type)) return;
    addVoted(id, type);
    jsonp('vote', { id: id, type: type }).then(function(res) { if (res.ok) render(res.comments, res.title); })
    .catch(function() { showError('投票に失敗しました。'); });
  }

  // ── Reply ────────────────────────────────────
  function setReply(text) {
    var preview = text.replace(/\n/g, ' ').slice(0, 35);
    var quoted  = '＞ ' + preview + (text.length > 35 ? '…' : '') + '\n\n';
    els.commentInput.value = quoted;
    els.commentInput.focus();
    els.commentInput.setSelectionRange(quoted.length, quoted.length);
    els.sendBtn.disabled = false;
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // ── Title edit (admin) ───────────────────────
  function saveTitle() {
    var t = els.titleInput.value.trim();
    els.titleInput.style.display = 'none'; els.titleText.style.display = 'block';
    if (!t) return;
    jsonp('setTitle', { title: t }).then(function(res) { if (res.ok) render(res.comments, res.title); });
  }
  els.titleText.addEventListener('click', function() {
    requireAdmin(function() {
      els.titleInput.value = els.titleText.textContent;
      els.titleText.style.display = 'none'; els.titleInput.style.display = 'block'; els.titleInput.focus();
    });
  });
  els.titleInput.addEventListener('blur', saveTitle);
  els.titleInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') els.titleInput.blur(); });

  // ── Reset (admin) ─────────────────────────────
  els.resetBtn.addEventListener('click', function() {
    requireAdmin(function() {
      if (!confirm('すべてのコメントを削除します。よろしいですか？')) return;
      jsonp('reset').then(function(res) {
        votedReactions = {};
        try { localStorage.removeItem(STORAGE_KEY_RXNS); } catch(e) {}
        if (res.ok) render(res.comments, res.title);
      });
    });
  });

  // ── Polling ──────────────────────────────────
  function refresh() {
    if (!APPS_SCRIPT_URL) return;
    jsonp('list').then(function(res) {
      if (res.ok) { render(res.comments, res.title); showPollStatus(true); }
      else showPollStatus(false);
    }).catch(function() { showPollStatus(false); });
  }
  function scheduleNext() {
    setTimeout(function() { refresh(); scheduleNext(); }, POLL_MS + Math.random() * 800 - 400);
  }
  refresh();
  scheduleNext();
</script>
</body>
</html>
